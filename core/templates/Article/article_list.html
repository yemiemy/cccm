{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="breadcumb-area">
	<div class="container">				
		<div class="row">
			<div class="col-md-12 txtc">
				<div class="breadcumb-inner">
					<ul>
						<li><a href="{% url 'home' %}">Home</a></li>
						<li><i class="fas fa-angle-right"></i></li>
						<li>Blog</li>
					</ul>						
				</div>
			</div>
		</div>
	</div>
</div>



<!-- themex-blog-area -->
<div class="themex-blog-area">	
	<div class="container">	
		<div class="row">
			{{articles}}
			{% for article in object_list %}
				<div class=" col-lg-4  col-md-6 col-sm-12 ">
					<div class="blog-part all_blog_color">
						<div class="blog_part_inner">
							<div class="witr_blog_imags">
								<div class="blog-img">
									<a href="{% url 'article_detail' article.id article.slug %}"> <img src="{{article.featured_image.url}}" alt=""> </a>
								</div>
							</div>
							<div class="wblog-content blog-content-2 all_blog_color">
								<span><a href="#"><i class="icofont-calendar"></i></a>{{article.date_stamp}}</span>
								<!-- <span><a href="#"><i class="icofont-speech-comments"></i>{{article.comment_set.count}}</a></span> -->
								<h5><a  href="{% url 'article_detail' article.id article.slug %}">{{article.title}}</a></h5>
								<a class="btn2"  href="{% url 'article_detail' article.id article.slug %}">Read More</a>
							</div>
						</div>
					</div>
				</div>
			{% endfor %}
		</div>
	</div>
</div>

{% endblock %}
