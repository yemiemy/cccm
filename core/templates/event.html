{% extends 'base/base.html' %}
{% load static %}

{% block content %}


<div class="breadcumb-area">
	<div class="container">				
		<div class="row">
			<div class="col-md-12 txtc">
				<div class="breadcumb-inner">
					<ul>
						<li><a href="{% url 'home' %}">Home</a></li>
						<li><i class="fas fa-angle-right"></i></li>
						<li>Events</li>
					</ul>						
				</div>
			</div>
		</div>
	</div>
</div>

<div class="themex_event_area">			
	<div class="container">
		<div class="row"> 
			<div class="col-lg-12">
				<div class="event_active event_style_adn_3 witr_3e event_all_color text-">				
					<div class="event_wrap">
						{% for event in events %}
						<div class="col-lg-12 col-md-12 col-sm-12  witr_all_mb_30">
							<div class="row themex-single-event_adn witr_event_style_5">
								<div class="col-lg-3 col-md-6">
									<div class="themex-event-thumb_adn">
										<a href="{% url 'event_detail' event.id event.name %}"> <img  src="{{event.thumbnail.url}}" alt=""></a>
									</div>									
								</div>
								<div class="col-lg-4 col-md-6">
									<div class="event-page-title_adn ">
										<p>Goal: ${{event.donations}}/${{event.goal}}</p>
										<h2><a href="{% url 'event_detail' event.id event.name %}">{{event.name}}</a></h2>
										<div class="themex-event-meta-left_adn">
											<span><i class="fas fa-map-marker-alt"></i>{{event.event_location}}</span>
										</div>
									</div>											
								</div>	
								<div class="col-lg-3 col-md-6">
									<div class="witr_event_d">
										<div class="event_date_5">
											<span><i class="fas fa-calendar"></i></span>
											<span>{{event.event_date_time}}</span>
										</div>
										
									</div>
								</div>
								<div class="col-lg-2 col-md-6">
									<div class="witr_event_btn btn_all_color">
										<a href="{% url 'event_detail' event.id event.name %}">Donate Now </a>
										<a href="{{event.registration_link}}">Register Now </a>

									</div>												
								</div>											
							</div>
						</div>
					{% endfor %}
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

{% endblock %}
